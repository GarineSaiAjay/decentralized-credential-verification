# Weekly pull requests for out-of-date or vulnerable dependencies, at most two open per ecosystem. Actions are pinned to a commit SHA and
# images to a digest (scripts/check-pins.sh enforces it); Dependabot rewrites the pin and the tag comment together.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
  # The optional on-chain worker.
  - package-ecosystem: cargo
    directory: /chain
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /chain
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
  # The images named in the compose files (Postgres, the WAF, Caddy).
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
  # The contract libraries (forge-std, OpenZeppelin) are submodules pinned to a release commit.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
