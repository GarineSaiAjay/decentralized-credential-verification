# The optional on-chain worker. A separate program with its own dependencies, so that neither the EVM key
# nor the EVM libraries enter the web-facing backend. It compiles backend/src/crypto.rs unchanged (see
# src/main.rs) to check blocks with exactly the backend's own hashing and signature code.
[package]
name = "acvs-chain"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alloy = { version = "2", default-features = false, features = [
    "std", "reqwest", "reqwest-rustls-tls", "provider-http", "contract", "sol-types",
    "rpc-types", "network", "signer-local", "signer-keystore",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
rpassword = "7"
# Needed only so that backend/src/crypto.rs compiles here; same versions as backend/Cargo.toml.
sha2 = "0.10"
ed25519-dalek = "2"
aes-gcm = "0.11"

[[bin]]
name = "acvs-chain"
path = "src/main.rs"

[workspace]
