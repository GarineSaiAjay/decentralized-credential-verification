# Writes contracts/test/vectors/merkle.json from the backend's own Merkle code, so the Solidity
# re-implementation is tested against the real thing. It compiles backend/src/crypto.rs unchanged.
[package]
name = "merkle-vectors"
version = "0.1.0"
edition = "2021"
publish = false

# Same versions as backend/Cargo.toml: these are what crypto.rs needs to compile.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
aes-gcm = "0.10"
rand = "0.8"

[workspace]
